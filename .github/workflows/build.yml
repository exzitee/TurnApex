name: Build & Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-server:
    name: Build Linux VPS Server (bypassd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-server-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-server-

      - name: Build bypassd release binary
        run: |
          cargo build --release -p bypassd
          strip target/release/bypassd

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: bypassd-linux-x86_64
          path: target/release/bypassd

  build-android:
    name: Build Android APK (Kotlin + Rust FFI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Compile Rust JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p bypass-app/app/src/main/jniLibs/arm64-v8a
          mkdir -p bypass-app/app/src/main/jniLibs/armeabi-v7a

          cargo ndk -t arm64-v8a -o bypass-app/app/src/main/jniLibs build --release -p bypass-core
          cargo ndk -t armeabi-v7a -o bypass-app/app/src/main/jniLibs build --release -p bypass-core

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        working-directory: bypass-app
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TurnApex-debug.apk
          path: bypass-app/app/build/outputs/apk/debug/*.apk
