[package]
name = "bypass-core"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Bypass Team"]
description = "Shared core library for VK TURN-based censorship bypass engine"

[lib]
name = "bypass_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["android-jni"]
android-jni = ["dep:jni"]

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.9"
byteorder = "1.5"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
socket2 = "0.5"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hmac = "0.12"
jni = { version = "0.21", optional = true }

[dev-dependencies]
tokio-test = "0.4"
