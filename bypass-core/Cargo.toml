[package]
name = "bypass-core"
version = "0.1.0"
edition = "2024"
authors = ["Antigravity Bypass Team"]
description = "Shared core library for VK TURN-based censorship bypass engine"

[lib]
name = "bypass_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["android-jni"]
android-jni = ["dep:jni"]

[dependencies]
# CSQTT core dependencies
aes = "0.9.2"
anyhow = "1.0.104"
arc-swap = "1.9.2"
aws-lc-rs = "=1.18.0"
base64 = "0.23.0"
byteorder = "1.5"
bytes = "1.12.1"
chrono = "0.4"
chacha20poly1305 = "0.10"
clap = { version = "4.6.4", default-features = false, features = ["derive", "std", "usage", "error-context"] }
crc32fast = "1.5.0"
crossbeam-queue = "0.3.13"
ctr = "0.10.1"
dashmap = "6.1"
getrandom = "0.4"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
libc = "0.2.189"
md-5 = "0.11.0"
primp = "1.3.1"
rand = { version = "0.10.2", features = ["sys_rng"] }
regex = { package = "regex-lite", version = "0.1.9" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
socket2 = "0.6.5"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util", "io-std"] }
tokio-util = "0.7.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turn-rustls = { package = "primp-rustls", version = "=0.23.40", default-features = false, features = ["std", "tls12"] }
turn-tokio-rustls = { package = "primp-tokio-rustls", version = "=0.26.5" }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }
webpki-roots = "=1.0.9"

# Optional JNI bindings for Android
jni = { version = "0.21", optional = true }

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.53.1", features = ["test-util"] }

