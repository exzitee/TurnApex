[package]
name = "bypassd"
version = "0.1.0"
edition = "2024"
authors = ["Antigravity Bypass Team"]
description = "VPS Daemon for VK TURN-based censorship bypass system"

[[bin]]
name = "bypassd"
path = "src/main.rs"

[dependencies]
bypass-core = { path = "../bypass-core", default-features = false }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0.104"
bytes = "1.12.1"
rand = { version = "0.10.2", features = ["sys_rng"] }
socket2 = "0.6.5"
