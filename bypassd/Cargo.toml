[package]
name = "bypassd"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Bypass Team"]
description = "VPS Daemon for VK TURN-based censorship bypass system"

[[bin]]
name = "bypassd"
path = "src/main.rs"

[dependencies]
bypass-core = { path = "../bypass-core", default-features = false }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
bytes = "1.9"
rand = "0.8"
socket2 = "0.5"
